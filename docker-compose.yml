services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission_local
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ConnectionStrings__AdmissionDb: "${ADMISSION_DB_CONNECTION:-Host=db;Port=5432;Database=admission;Username=admission;Password=admission_local}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: