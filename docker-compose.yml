services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: admission
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission_local
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
      ConnectionStrings__AdmissionDb: "${ADMISSION_DB_CONNECTION:-Host=db;Port=5432;Database=admission;Username=admission;Password=admission_local;GSS Encryption Mode=Disable}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://backend:8080}"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
